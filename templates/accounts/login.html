{% extends 'base.html' %}
{% block title %}Login — PPC System{% endblock %}

{% block public_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e5fa8 0%,#174a85 100%);padding:20px;">
    <div class="card" style="width:100%;max-width:400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-gear-fill" style="font-size:3rem;color:#1e5fa8;"></i>
                <h4 class="mt-2 mb-0" style="color:#1e5fa8;font-weight:700;">PPC System</h4>
                <small class="text-muted">Production Planning & Control</small>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger py-2 mb-3">
                <small><i class="bi bi-exclamation-triangle"></i> Username ya password galat hai.</small>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
