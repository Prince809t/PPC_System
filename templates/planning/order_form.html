{% extends 'base.html' %}
{% block title %}Naya Order — PPC System{% endblock %}
{% block page_title %}Naya Order{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-1"><i class="bi bi-plus-circle text-primary"></i> Naya Order</h5>
            <p class="mb-0 text-muted" style="font-size:0.88rem;">
                Order number bilkul waisa likho jaisa order sheet pe hai.
            </p>
        </div>
        <a href="{% url 'order_list' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Order / Sample No. *</label>
                    <input type="text" name="order_no" class="form-control" required
                           placeholder="Bilkul waisa hi jaisa order sheet pe hai">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Style</label>
                    <input type="text" name="style" class="form-control" placeholder="T-Shirt, Polo, etc.">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Buyer</label>
                    <input type="text" name="buyer" class="form-control">
                </div>
                <div class="col-md-3 col-6">
                    <label class="form-label">Order Qty</label>
                    <input type="number" name="order_qty" class="form-control" value="0" min="0">
                </div>
                <div class="col-md-3 col-6">
                    <label class="form-label">Order Date</label>
                    <input type="date" name="order_date" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="PENDING">Pending</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Save Karo
                </button>
                <a href="{% url 'order_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
